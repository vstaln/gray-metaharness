[package]
name = "gray-metaharness"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Meta-harness for gray: end-to-end search over context-injection policies (arXiv:2603.28052)"

[[bin]]
name = "gray-metaharness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
